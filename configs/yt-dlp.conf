###===================================================================###
### MULTI_DOWNLOADER — yt-dlp Engine Configuration                    ###
### Located at: configs/yt-dlp.conf                                   ###
###===================================================================###

###---Output & File Naming---
# Note: Base download directory is managed dynamically by MULTI_DOWNLOADER
# into ~downloads\yt-dlp\<host>\. The template below controls file naming.
-o "%(title)+.100s -- %(uploader)+.100s%(uploader_id&___|)s%(uploader_id|)s -- %(id)s.%(ext)s"

###---Archive Database---
# Standalone text archive is disabled to use MULTI_DOWNLOADER's centralized SQLite archive (data/archive.db)
#--download-archive "archive.txt"

###---Authentication & Cookies---
# Note: Do not enable cookies unconditionally here. Unverified Google accounts cause YouTube to
# throttle video resolution to 360p. MULTI_DOWNLOADER automatically uses clean anonymous 4K first
# and seamlessly falls back to Firefox cookies whenever sign-in is strictly required.
#--cookies-from-browser firefox

###---Video and Audio Quality---
-f bestvideo*+bestaudio/best
--merge-output-format mp4
--embed-thumbnail
--add-metadata
--embed-metadata
--embed-chapters
#--mark-watched

###---Subtitles---
#--write-sub
--write-auto-subs
--embed-subs 
--sub-lang en,en-US,en-GB,enUS

###---File Overwrites---
--no-overwrites
--no-post-overwrites

###---Network & Resilience---
--color auto-tty
--yes-playlist
--fragment-retries 10
--socket-timeout 15
#--ignore-errors  # Disabled in MULTI_DOWNLOADER so errors can be handled and retried via auto-fallback

###---Proof-of-Origin (PO Token) & Challenge Solvers---
--extractor-args "youtube:formats=missing_pot"
--remote-components "ejs:github"

###---FFmpeg Binary Path---
# Note: MULTI_DOWNLOADER auto-resolves ffmpeg from system PATH or ~/yt-dlp/ffmpeg.exe
#--ffmpeg-location "ffmpeg.exe"

###---Site-Specific Aliases---
# Facebook: standard MP4
--alias facebook "-f best/bestvideo+bestaudio --merge-output-format mp4"

# VKontakte: with cookies file
#--alias vk "--cookies \"cookies/vk_cookies.txt\""

# YouTube Audio: extract high-quality audio with metadata
--alias yt-audio "-x --audio-format aac --audio-quality 0 --embed-thumbnail"